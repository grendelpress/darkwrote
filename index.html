<!doctype html>
<html lang="en" data-mode="dark" data-adapt="true">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#161b22" />
    <meta name="description" content="A themed reader and editor for Word documents. Works offline." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Darkwrote</title>
  </head>
  <body>
    <header class="topbar">
      <button id="btn-menu" class="btn menu-toggle" aria-label="Menu" aria-expanded="false" aria-controls="menu">☰</button>
      <div class="brand">Darkwrote</div>
      <div id="menu" class="menu">
        <button id="btn-open" class="btn" title="Open a .docx file (Ctrl+O)">Open</button>
        <button id="btn-new" class="btn" title="New blank document">New</button>
        <button id="btn-save" class="btn primary" title="Save (Ctrl+S)">Save</button>
        <button id="btn-saveas" class="btn" title="Save a copy as .docx">Save as…</button>
        <button id="btn-export" class="btn" title="Export the document or your annotations">Export…</button>
        <button id="btn-revert" class="btn" title="Discard your notes and edits and reload the original file">Revert to original</button>
        <button id="btn-close" class="btn" title="Close this document">Close</button>
        <label class="theme-pick">Theme
          <select id="theme-select"></select>
        </label>
        <button id="btn-themes" class="btn" title="Create or edit themes">Customize…</button>
        <button id="btn-install" class="btn" title="Install Darkwrote on this device" hidden>Install app</button>
      </div>
      <span id="doc-name" class="doc-name">Untitled.docx</span>
      <span id="dirty" class="dirty" hidden>● not exported</span>
      <span class="spacer"></span>
      <div class="view-actions">
        <button id="btn-mode" class="btn" title="Switch between reading and editing">📖 Read</button>
        <button id="btn-readset" class="btn" title="Text size and reading options" aria-label="Reading options">Aa</button>
        <button id="btn-outline" class="btn toggle" title="Show or hide the outline">Outline</button>
        <button id="btn-comments" class="btn toggle" title="Show or hide comments">Comments</button>
      </div>
      <input id="file-input" type="file" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/octet-stream" hidden />
    </header>
    <div id="read-settings" class="popover" role="dialog" aria-label="Reading options" hidden></div>
    <div id="toolbar" class="toolbar" role="toolbar" aria-label="Formatting"></div>
    <div class="layout">
      <aside id="outline" class="side left" aria-label="Document outline"></aside>
      <main class="workspace" id="workspace">
        <div class="empty-state" id="empty">
          <h1>No document open</h1>
          <p>Open a Word file, drop one anywhere on this window, or start a blank document.</p>
          <div class="row">
            <button id="empty-open" class="btn primary">Open a .docx…</button>
            <button id="empty-new" class="btn">New document</button>
          </div>
          <section id="recent" class="recent" aria-label="Recent documents" hidden></section>
        </div>
        <div class="page" id="page">
          <div id="editor"></div>
        </div>
      </main>
      <aside id="comments" class="side right" aria-label="Comments"></aside>
    </div>
    <div id="scrim" class="scrim" hidden></div>
    <div id="selbar" class="selbar" role="toolbar" aria-label="Selection actions" hidden></div>
    <div id="composer" class="composer" hidden></div>
    <div id="toast" class="toast" role="status" hidden></div>
    <div id="drop-hint" class="drop-hint" hidden>Drop a .docx file to open it</div>
    <dialog id="theme-dialog" class="dialog"></dialog>
    <dialog id="export-dialog" class="dialog"></dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
